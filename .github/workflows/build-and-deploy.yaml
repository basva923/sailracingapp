name: Build and test
on:
  push:
    branches: [main, dev, native]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and coverage gates (domain, simulation, desktop, app)
        run: ./gradlew check koverVerify --console=plain

      - name: Coverage report
        if: always()
        run: ./gradlew koverHtmlReport --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sail-racing-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/kover/html
            **/build/reports/tests
