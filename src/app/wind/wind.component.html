<mat-card>
  <p class="text-center">Speed</p>
  <div class="text-center wvfullscreen">{{ speedText }}</div>

  <p class="text-center">Calculated wind</p>
  <div class="text-center wvfullscreen">{{ calculatedWindDirectionText }}</div>

  <mat-grid-list cols="1" rowHeight="300px" gutterSize="16px">
    <mat-grid-tile>
      <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [title]="chartOptions.title"
        [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis" #chart></apx-chart>
    </mat-grid-tile>
    <mat-grid-tile>
      <apx-chart [series]="chartOptionsWF.series" [chart]="chartOptionsWF.chart" [title]="chartOptionsWF.title"
        [xaxis]="chartOptionsWF.xaxis" [yaxis]="chartOptionsWF.yaxis" [annotations]="chartOptionsWF.annotations"
        #chartWF></apx-chart>
    </mat-grid-tile>
  </mat-grid-list>

  <mat-divider class="my-3"></mat-divider>

  <mat-grid-list cols="2" rowHeight="40px">
    <mat-grid-tile>
      <div class="text-center">Heading</div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="text-center">Configured wind</div>
    </mat-grid-tile>
  </mat-grid-list>

  <mat-grid-list cols="2" rowHeight="60px">
    <mat-grid-tile>
      <p class="wvhalfscreen text-center">{{ headingText }}</p>
    </mat-grid-tile>
    <mat-grid-tile>
      <p class="wvhalfscreen text-center">{{ configuredWindText }}</p>
    </mat-grid-tile>
  </mat-grid-list>

  <mat-grid-list cols="2" rowHeight="60px" class="mt-5">
    <mat-grid-tile>
      <button mat-raised-button color="primary" class="w-100" (click)="setStarboardTack()" style="width: 100%;">
        Set startboard
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button color="primary" class="w-100" (click)="setPortTack()" style="width: 100%;">
        Set port
      </button>
    </mat-grid-tile>
  </mat-grid-list>

  <mat-grid-list cols="2" rowHeight="60px" class="mt-3">
    <mat-grid-tile>
      <button mat-raised-button color="warn" class="w-100" (click)="configureWind()" style="width: 100%;">
        Wind
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button color="warn" class="w-100" (click)="configureAngleOfAttack()" style="width: 100%;">
        Attack
      </button>
    </mat-grid-tile>
  </mat-grid-list>

  <mat-grid-list cols="2" rowHeight="60px" class="mt-3">
    <mat-grid-tile>
      <button mat-raised-button color="warn" class="w-100" (click)="reservePhone()" style="width: 100%;">
        Reserve phone
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button color="warn" class="w-100" (click)="resetWindFrequency()" style="width: 100%;">
        Reset wind frequency
      </button>
    </mat-grid-tile>
  </mat-grid-list>
</mat-card>
