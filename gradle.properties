# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only supported support library.
android.useAndroidX=true
# Only generate R classes for the module's own resources (faster builds).
android.nonTransitiveRClass=true

kotlin.code.style=official
